name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Image Docker et démarrage
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - name: Construire et démarrer avec docker compose
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          docker compose up -d --build
      - name: Attendre le healthcheck
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' route-des-syllabes)
            echo "santé : $etat"
            [ "$etat" = healthy ] && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Créer un compte et se connecter
        run: |
          docker compose exec -T app npm run create-user -- --email ci@ecole.fr --password "motdepasse-ci"
          curl -fsS http://localhost:8080/ | grep -q "La Route des Syllabes"
          curl -fsS -c cookies.txt -X POST http://localhost:8080/api/auth/login \
            -H "Origin: http://localhost:8080" -H "Content-Type: application/json" \
            -d '{"email":"ci@ecole.fr","motDePasse":"motdepasse-ci"}'
          test "$(curl -fsS -b cookies.txt http://localhost:8080/api/seances | grep -o '"nom"' | wc -l)" = 4
          docker compose exec -T app id -u | grep -vq '^0$'
      - name: Taille de l'image
        run: docker image ls route-des-syllabes
      - if: always()
        run: docker compose down -v
